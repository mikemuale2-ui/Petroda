/* ── VARIABLES ── */

/* ── SCREENS ── */
#scr-login,#scr-app{min-height:100vh}
#scr-login{
  display:flex;align-items:center;justify-content:center;
  padding:20px;background:var(--navy);
}
#scr-app{display:none;flex-direction:column;background:var(--bg)}

/* ── LOGIN CARD ── */
.lcard{
  background:#fff;border-radius:22px;padding:36px 24px 28px;
  width:100%;max-width:360px;
  box-shadow:0 20px 60px rgba(0,0,0,.4);

.lcard-logo{

.lcard-sub{text-align:center;font-size:14px;color:#8e8e93;margin-bottom:28px}
.lcard label{display:block;font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;color:#8e8e93;margin-bottom:8px}
.lcard select,.lcard input[type=password]{
  display:block;width:100%;height:var(--input-h);
  border:1.5px solid var(--border);border-radius:var(--radius);
  padding:0 16px;font-size:17px;color:#1c1c1e;background:#fff;
  -webkit-appearance:none;appearance:none;outline:none;
  margin-bottom:16px;
}
.lcard select:focus,.lcard input:focus{border-color:var(--blue)}
#btn-signin{
  display:block;width:100%;height:var(--btn-h);
  background:var(--navy);color:#fff;border:none;
  border-radius:var(--radius);font-size:17px;font-weight:700;
  cursor:pointer;margin-top:4px;-webkit-appearance:none;

}
#btn-signin:active{opacity:.75}
#l-err{

/* ── TOPBAR ── */

@keyframes shake{0%,100%{transform:translateX(0)}30%{transform:translateX(-10px)}70%{transform:translateX(10px)}}

.seg-btn.active{

.calcbox.empty{background:#f9f9f9;border:1.5px solid #e5e7eb}

.calcbox span{font-size:15px;font-weight:700;color:#1d4ed8;line-height:1.6}
.calcbox.empty span{color:#8e8e93;font-weight:500;font-size:14px}

/* ── SAVE BUTTON ── */
#btn-save{

/* ── TOAST ── */
#toast{

/* ── EDIT SHEET ── */

.btn-save-edit{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-save-edit:active{opacity:.75}

function g(id){return document.getElementById(id);}
function today(){return new Date().toISOString().split("T")[0];}
function mzn(n){return"MZN "+Number(n).toLocaleString("pt-MZ",{minimumFractionDigits:2,maximumFractionDigits:2});}
function fd(d){if(!d)return"—";var p=d.split("-");return p[2]+"/"+p[1]+"/"+p[0];}
function mins(sd,st,ed,et){
  var s=new Date(sd+"T"+(st||"00:00")),e=new Date(ed+"T"+(et||"00:00"));
  return(isNaN(s)||isNaN(e))?0:Math.max(0,(e-s)/60000);
}
function calc(sd,st,ed,et,op,prod){
  var m=mins(sd,st,ed,et);if(!m)return null;
  var h=Math.floor(m/60),mn=Math.round(m%60),d=m/1440;
  var rate=(cfg.rates&&cfg.rates[op+"|"+prod])||0;
  return{m:m,h:h,mn:mn,d:d,rate:rate,pay:d*rate};
}

}

    var s=document.createElement("script");
    s.src=src;s.onload=cb;
    s.onerror=function(){g("sync-pill").textContent="offline";};
    document.head.appendChild(s);
  }
  load("https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js",function(){
    load("https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js",function(){
      try{
        if(!firebase.apps.length)firebase.initializeApp(FB);
        fbDb=firebase.firestore();
        setSynced(true);
        // Pull then listen
        fbDb.collection(FB_COL).get().then(function(snap){
          var seen={},changed=false;
          jobs.forEach(function(j){seen[j.id]=true;});
          snap.forEach(function(d){
            var data=d.data();
            if(!seen[data.id]){jobs.push(data);seen[data.id]=true;changed=true;}
          });
          if(changed)lsave();
          // Live listener
          fbDb.collection(FB_COL).onSnapshot(function(snap){
            snap.docChanges().forEach(function(ch){
              var data=ch.doc.data();
              if(ch.type==="added"||ch.type==="modified"){
                var i=jobs.findIndex(function(j){return j.id===data.id;});
                if(i>=0)jobs[i]=data;else jobs.push(data);
                lsave();
              }
              if(ch.type==="removed"){jobs=jobs.filter(function(j){return j.id!==data.id;});lsave();}
            });
            setSynced(true);
          },function(){setSynced(false);});
        });
      }catch(e){setSynced(false);}
    });
  });
}
function fbPush(job){
  if(!fbDb)return;
  fbDb.collection(FB_COL).doc(String(job.id)).set(job)
    .then(function(){setSynced(true);})
    .catch(function(e){console.warn("fbPush:",e);});
}
function setSynced(ok){
  var el=g("sync-pill");if(!el)return;
  el.textContent=ok?"synced":"offline";
  el.className=ok?"live":"";
}

// ═══════════════════════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════════════════════
function doSignIn(){
  var uid=g("l-user").value,pw=g("l-pw").value,err=g("l-err");
  var u=USERS.find(function(x){return x.id===uid;});
  if(!u){err.textContent="Select a user.";return;}
  if(pw!==u.pw){err.textContent="Wrong password.";g("l-pw").value="";return;}
  err.textContent="";me=u;
  try{sessionStorage.setItem(LS_SESS,JSON.stringify({id:u.id}));}catch(e){}
  showApp();
}
function doLock(){
  me=null;
  try{sessionStorage.removeItem(LS_SESS);}catch(e){}
  g("scr-app").style.display="none";
  g("scr-login").style.display="flex";
  g("l-pw").value="";g("l-err").textContent="";
}
function showApp(){
  g("scr-login").style.display="none";
  g("scr-app").style.display="flex";
  g("scr-app").style.flexDirection="column";
  g("tb-user").textContent=me.name;
  resetForm();
  fbInit();
}

// ═══════════════════════════════════════════════════════════════
// SEGMENT CONTROLS
// ═══════════════════════════════════════════════════════════════
function setOp(v){
  selOp=v;
  g("op-r").className="seg-btn"+(v==="Product Receipt"?" active active-r":"");
  g("op-p").className="seg-btn"+(v==="Pumping"?" active active-p":"");
  recalc();
}
function setPr(v){
  selProd=v;
  g("pr-a").className="seg-btn"+(v==="AGO"?" active active-a":"");
  g("pr-p").className="seg-btn"+(v==="PMS"?" active active-m":"");
  recalc();
}
function setEOp(v){
  eOp=v;
  g("e-op-r").className="seg-btn"+(v==="Product Receipt"?" active active-r":"");
  g("e-op-p").className="seg-btn"+(v==="Pumping"?" active active-p":"");
  eCalc();
}
function setEPr(v){
  eProd=v;
  g("e-pr-a").className="seg-btn"+(v==="AGO"?" active active-a":"");
  g("e-pr-p").className="seg-btn"+(v==="PMS"?" active active-m":"");
  eCalc();
}

// ═══════════════════════════════════════════════════════════════
// CALCULATORS
// ═══════════════════════════════════════════════════════════════
function recalc(){
  var sd=g("f-sd").value,st=g("f-st").value,ed=g("f-ed").value,et=g("f-et").value;
  var box=g("calcbox"),txt=g("calc-txt");
  if(!sd||!st||!ed||!et){box.className="calcbox empty";txt.textContent="Fill in start and end time…";return;}
  var r=calc(sd,st,ed,et,selOp,selProd);
  if(!r||r.m<=0){box.className="calcbox bad";txt.textContent="⚠ End must be after start";return;}
  box.className="calcbox ready";
  var ds=r.d.toLocaleString("en",{minimumFractionDigits:2,maximumFractionDigits:4});
  txt.innerHTML="<strong>"+r.h+"h "+r.mn+"m</strong> = <strong>"+ds+" days</strong>"+(r.rate?" → <strong style='color:#16a34a'>"+mzn(r.pay)+"</strong>":"");
}
function eCalc(){
  var sd=g("e-sd").value,st=g("e-st").value,ed=g("e-ed").value,et=g("e-et").value;
  var el=g("e-calc");
  if(!sd||!st||!ed||!et){el.textContent="Set times to calculate…";return;}
  var r=calc(sd,st,ed,et,eOp,eProd);
  if(!r||r.m<=0){el.textContent="⚠ End must be after start";return;}
  var ds=r.d.toLocaleString("en",{minimumFractionDigits:2,maximumFractionDigits:4});
  el.innerHTML="<strong>"+r.h+"h "+r.mn+"m</strong> = <strong>"+ds+" days</strong>"+(r.rate?" → <strong style='color:#16a34a'>"+mzn(r.pay)+"</strong>":"");
}

// ═══════════════════════════════════════════════════════════════
// SAVE
// ═══════════════════════════════════════════════════════════════
function doSave(){
  var name=g("f-name").value.trim();
  var sd=g("f-sd").value,st=g("f-st").value,ed=g("f-ed").value,et=g("f-et").value;
  if(!name){
    g("f-name").className="shake";
    setTimeout(function(){g("f-name").className="";},400);
    toast("⚠ Enter operator name");return;
  }
  if(!sd||!st){toast("⚠ Set start date and time");return;}
  if(!ed||!et){toast("⚠ Set end date and time");return;}
  var r=calc(sd,st,ed,et,selOp,selProd);
  if(!r||r.m<=0){toast("⚠ End must be after start");return;}
  if(!r.rate){toast("⚠ No rate configured — set rates in desktop Settings");return;}
  var job={id:Date.now(),name:name,op:selOp,prod:selProd,
    start:sd,startTime:st,end:ed,endTime:et,
    days:r.d,totalMinutes:r.m,rate:r.rate,pay:r.pay,otHrs:0};
  jobs.push(job);lsave();fbPush(job);
  showSuccess(job);
  g("f-name").value="";
  toast("✓ Saved"+(fbDb?" & synced":"")+" — "+r.h+"h "+r.mn+"m = "+mzn(r.pay));
}
function showSuccess(j){
  var r=calc(j.start,j.startTime,j.end,j.endTime,j.op,j.prod);if(!r)return;
  var ds=r.d.toLocaleString("en",{minimumFractionDigits:2,maximumFractionDigits:4});
  var opL=j.op==="Product Receipt"?"Receipt":"Pumping";
  g("sc-name").textContent=j.name;
  g("sc-meta").textContent=opL+" · "+j.prod;
  g("sc-detail").innerHTML="Start: "+fd(j.start)+" "+j.startTime
    +"<br>End: &nbsp; "+fd(j.end)+" "+j.endTime
    +"<br>Time: "+r.h+"h "+r.mn+"m = "+ds+" days";
  g("sc-pay").textContent=mzn(r.pay);
  g("btn-edit-last").setAttribute("data-id",j.id);
  g("success-card").style.display="block";
  setTimeout(function(){g("success-card").scrollIntoView({behavior:"smooth",block:"start"});},50);
}

// ═══════════════════════════════════════════════════════════════
// EDIT
// ═══════════════════════════════════════════════════════════════
function openEdit(id){
  var j=jobs.find(function(x){return x.id===id;});if(!j)return;
  editId=id;eOp=j.op;eProd=j.prod;
  g("e-name").value=j.name;
  g("e-sd").value=j.start;g("e-st").value=j.startTime||"";
  g("e-ed").value=j.end;  g("e-et").value=j.endTime||"";
  setEOp(eOp);setEPr(eProd);eCalc();
  g("edit-overlay").className="open";
}
function closeEdit(){g("edit-overlay").className="";editId=null;}
function doEditSave(){
  var idx=jobs.findIndex(function(x){return x.id===editId;});if(idx<0)return;
  var name=g("e-name").value.trim();
  var sd=g("e-sd").value,st=g("e-st").value,ed=g("e-ed").value,et=g("e-et").value;
  if(!name){toast("⚠ Enter operator name");return;}
  if(!sd||!st||!ed||!et){toast("⚠ Fill in all date and time fields");return;}
  var r=calc(sd,st,ed,et,eOp,eProd);
  if(!r||r.m<=0){toast("⚠ End must be after start");return;}
  var u={id:editId,name:name,op:eOp,prod:eProd,
    start:sd,startTime:st,end:ed,endTime:et,
    days:r.d,totalMinutes:r.m,rate:r.rate,pay:r.pay,otHrs:0};
  jobs[idx]=u;lsave();fbPush(u);
  showSuccess(u);closeEdit();
  toast("✓ Updated"+(fbDb?" & synced":""));
}

// ═══════════════════════════════════════════════════════════════
// RESET
// ═══════════════════════════════════════════════════════════════
function resetForm(){
  var t=today();
  g("f-name").value="";
  g("f-sd").value=t;g("f-st").value="06:00";
  g("f-ed").value=t;g("f-et").value="06:00";
  setOp("Product Receipt");setPr("AGO");recalc();
  g("success-card").style.display="none";
}

// ═══════════════════════════════════════════════════════════════
// EVENTS — single document listener (most reliable on all iOS)
// ═══════════════════════════════════════════════════════════════
document.addEventListener("click",function(e){
  var t=e.target;
  while(t&&t!==document){
    switch(t.id){
      case "btn-signin":  doSignIn(); return;
      case "btn-lock":    doLock();   return;
      case "op-r":  setOp("Product Receipt"); return;
      case "op-p":  setOp("Pumping");         return;
      case "pr-a":  setPr("AGO");             return;
      case "pr-p":  setPr("PMS");             return;
      case "btn-save":      doSave(); return;
      case "btn-edit-last":
        var did=parseInt(t.getAttribute("data-id"));
        if(!isNaN(did))openEdit(did); return;
      case "e-op-r": setEOp("Product Receipt"); return;
      case "e-op-p": setEOp("Pumping");          return;
      case "e-pr-a": setEPr("AGO");              return;
      case "e-pr-p": setEPr("PMS");              return;
      case "e-cancel": closeEdit(); return;
      case "e-ok":     doEditSave(); return;
      case "edit-overlay": if(e.target===g("edit-overlay"))closeEdit(); return;
    }
    t=t.parentElement;
  }
},false);

document.addEventListener("change",function(e){
  var id=e.target.id;
  if(id==="f-sd"||id==="f-st"||id==="f-ed"||id==="f-et")recalc();
  if(id==="e-sd"||id==="e-st"||id==="e-ed"||id==="e-et")eCalc();
},false);

document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target.id==="l-pw")doSignIn();
},false);

// ═══════════════════════════════════════════════════════════════
// REGISTER SERVICE WORKER
// ═══════════════════════════════════════════════════════════════
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").catch(function(){});
}

// ═══════════════════════════════════════════════════════════════
// BOOT — runs immediately
// ═══════════════════════════════════════════════════════════════
(function(){
  var restored=false;
  try{
    var s=sessionStorage.getItem(LS_SESS);
    if(s){var sess=JSON.parse(s);var u=USERS.find(function(x){return x.id===sess.id;});if(u){me=u;restored=true;}}
  }catch(e){}
  if(restored){g("scr-login").style.display="none";showApp();}
  else{g("scr-login").style.display="flex";}
})();
</script>
